name: CI/CD - Django (server-side git pull)

on:
    push:
        branches: ["ci/cd"]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout (CI runner only; not used for copy)
              uses: actions/checkout@v4

            # sanity check is optional; you already proved SSH works
            - name: Sanity-check SSH key & connectivity
              run: |
                echo "${{ secrets.DROPLET_SSH_KEY }}" > key.pem
                chmod 600 key.pem
                ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }} "echo ✅ SSH OK"

            - name: Remote deploy via SSH (git pull + restart)
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.DROPLET_IP }}
                  username: ${{ secrets.DROPLET_USER }}
                  key: ${{ secrets.DROPLET_SSH_KEY }}
                  command_timeout: 20m
                  script: |
                      set -euo pipefail

                      APP_DIR="${{ secrets.APP_DIR }}"
                      BRANCH="${{ secrets.DEPLOY_BRANCH || 'ci/cd' }}"
                      SERVICE="${{ secrets.SYSTEMD_SERVICE }}"
                      PY="${{ secrets.PYTHON_BIN || 'python3' }}"

                      echo "APP_DIR: ${APP_DIR}"
                      echo "BRANCH: ${BRANCH}"

                      mkdir -p "$APP_DIR"
                      cd "$APP_DIR"

                      # trust GitHub host key (idempotent)
                      ssh-keyscan -t rsa,ed25519 github.com | sudo tee -a /etc/ssh/ssh_known_hosts > /dev/null

                      if [ ! -d ".git" ]; then
                        echo "Repo not found in $APP_DIR. Run the bootstrap clone first."; exit 1
                      fi

                      git fetch --all --prune
                      git checkout "$BRANCH"
                      git reset --hard "origin/$BRANCH"
                      git clean -fdx -e ".env" || true

                      if [ ! -d ".venv" ]; then
                        ${PY} -m venv .venv
                      fi
                      . .venv/bin/activate
                      python -m pip install --upgrade pip
                      [ -f requirements.txt ] && pip install -r requirements.txt

                      # load env if present
                      if [ -f .env ]; then
                        set -o allexport; . ./.env; set +o allexport
                      fi

                      python manage.py migrate --noinput
                      python manage.py collectstatic --noinput || true

                      sudo systemctl daemon-reload
                      sudo systemctl restart "$SERVICE"
                      sudo systemctl status "$SERVICE" --no-pager || true
                      sudo journalctl -u "$SERVICE" --since "-5 min" --no-pager -n 200 || true
